<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Class diagram</title>
  <desc id="desc">UML-style class diagram for Game, Board, AccountManager, HistoryManager, UserAccount, SessionPlayer, and MatchRecord.</desc>
  <style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:15px}.box{fill:#fff;stroke:#2f6db5;stroke-width:2;rx:6}.head{fill:#eaf3ff}.line{stroke:#2f6db5;stroke-width:2;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2f6db5"/></marker></defs>
  <rect x="345" y="20" width="210" height="95" class="box"/><rect x="345" y="20" width="210" height="30" class="head"/><text x="450" y="41" text-anchor="middle">Game</text><text x="360" y="72">state, players, board</text><text x="360" y="94">render(), run(), startGame()</text>
  <rect x="45" y="170" width="170" height="90" class="box"/><rect x="45" y="170" width="170" height="30" class="head"/><text x="130" y="191" text-anchor="middle">Board</text><text x="60" y="222">grid[ROWS][COLS]</text><text x="60" y="244">dropCoin(), wincheck()</text>
  <rect x="250" y="170" width="190" height="90" class="box"/><rect x="250" y="170" width="190" height="30" class="head"/><text x="345" y="191" text-anchor="middle">AccountManager</text><text x="265" y="222">deque&lt;UserAccount&gt;</text><text x="265" y="244">load(), save(), login()</text>
  <rect x="475" y="170" width="190" height="90" class="box"/><rect x="475" y="170" width="190" height="30" class="head"/><text x="570" y="191" text-anchor="middle">HistoryManager</text><text x="490" y="222">vector&lt;MatchRecord&gt;</text><text x="490" y="244">load(), save(), add()</text>
  <rect x="700" y="170" width="165" height="90" class="box"/><rect x="700" y="170" width="165" height="30" class="head"/><text x="782" y="191" text-anchor="middle">SessionPlayer</text><text x="715" y="222">name, colorIdx</text><text x="715" y="244">UserAccount*</text>
  <rect x="240" y="315" width="190" height="85" class="box"/><rect x="240" y="315" width="190" height="30" class="head"/><text x="335" y="336" text-anchor="middle">UserAccount</text><text x="255" y="366">username, password</text><text x="255" y="388">colors, stats</text>
  <rect x="500" y="315" width="190" height="85" class="box"/><rect x="500" y="315" width="190" height="30" class="head"/><text x="595" y="336" text-anchor="middle">MatchRecord</text><text x="515" y="366">p1Name, p2Name</text><text x="515" y="388">result, timeTaken</text>
  <path d="M390 115 L150 170" class="line"/><path d="M425 115 L350 170" class="line"/><path d="M485 115 L555 170" class="line"/><path d="M520 115 L765 170" class="line"/><path d="M345 260 L335 315" class="line"/><path d="M575 260 L595 315" class="line"/>
</svg>
