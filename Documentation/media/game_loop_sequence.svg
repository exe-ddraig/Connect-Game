<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-labelledby="title desc">
  <title id="title">Game loop sequence</title>
  <desc id="desc">Frame loop timing, input, animation updates, rendering, and presentation.</desc>
  <style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:16px}.box{fill:#f7fbff;stroke:#2f6db5;stroke-width:2;rx:8}.line{stroke:#2f6db5;stroke-width:2;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2f6db5"/></marker></defs>
  <rect x="30" y="90" width="120" height="70" class="box"/><text x="90" y="120" text-anchor="middle">Get ticks</text><text x="90" y="143" text-anchor="middle">clamp dt</text>
  <rect x="185" y="90" width="120" height="70" class="box"/><text x="245" y="120" text-anchor="middle">Poll</text><text x="245" y="143" text-anchor="middle">events</text>
  <rect x="340" y="90" width="140" height="70" class="box"/><text x="410" y="120" text-anchor="middle">Update</text><text x="410" y="143" text-anchor="middle">drops/effects</text>
  <rect x="515" y="90" width="140" height="70" class="box"/><text x="585" y="120" text-anchor="middle">Render</text><text x="585" y="143" text-anchor="middle">state screen</text>
  <rect x="690" y="90" width="150" height="70" class="box"/><text x="765" y="120" text-anchor="middle">Present</text><text x="765" y="143" text-anchor="middle">renderer</text>
  <path d="M150 125 L185 125" class="line"/><path d="M305 125 L340 125" class="line"/><path d="M480 125 L515 125" class="line"/><path d="M655 125 L690 125" class="line"/><path d="M765 160 C765 215 90 215 90 160" class="line"/>
</svg>
